<div class="page-holder align-items-center py-4 bg-gray-100 vh-100">
    <div class="container">
        <div class="row align-items-center ">
            <div class="col-8 offset-2 col-xs-12 px-lg-4 ">
                <div class="card">
            
                    <div class="card-header px-lg-5 bg-indigo">
                        <div ngClass="tituloLog" class="card-heading text-primary"><img src="gdcit/assets/logoGDC.png"  class="rounded mx-auto d-block logoGDC"></div>
                    </div>
                    <div class="card-body p-lg-5">
                        <h3 class="mb-4">Hola, 👋!Bienvenido Al Control De Empleados!👋</h3>
                        <form #form="ngForm">
                            <div class="form-floating mb-3">
                                <input name="usuario" [(ngModel)]="usuario"  class="form-control" id="usuario" type="email" placeholder="Usuario">
                            </div>
                            <div class="form-floating mb-3">
                                <input name="password" [(ngModel)]="password" class="form-control" id="password" type="password" placeholder="Contraseña">
                            </div>
                            <div class="row">
                                <button (click)="login()" class="btn btn-primary col-8 offset-2" type="button">Iniciar Sesión</button>
                            </div>
                            <div class="text-center"> <a class="nav-link" aria-current="page" routerLink="/signIn" title="EMPLEADOS">Registrarse</a>
                            </div>
                            </form>
                    </div>
                    <div class="card-footer px-lg-5 py-lg-4 bg-indigo">
                        <div class="text-sm text-muted"> ... </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
